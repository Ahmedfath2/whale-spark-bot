name: Smart Money Momentum Scan

on:
  schedule:
    - cron: '*/15 * * * *'   # كل 15 دقيقة
  workflow_dispatch:          # يسمح بتشغيل يدوي من تبويب Actions للتجربة

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تشغيل البوت
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: node index.js

      - name: حفظ حالة السجل التاريخي
        run: |
          git config user.name "smart-money-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "تحديث سجل الحجم [auto]"
          git push
